spring.application.name=eventapp
server.port=8080
spring.datasource.url=jdbc:mysql://localhost:3306/eventapp_db
spring.datasource.username=root
spring.datasource.password=password
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.sql.init.mode=always
spring.mvc.cors.allowed-origins=http://10.0.2.2:8080,http://localhost:8080
logging.level.com.college.eventapp=DEBUG
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=yourgmail@gmail.com
spring.mail.password=yourpassword
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.test-connection=false
app.password-reset.base-url=http://10.0.2.2:8080/reset-password
app.password-reset.from-address=yourgmail@gmail.com
app.password-reset.token-expiry-minutes=15
app.password-reset.request-cooldown-seconds=60
